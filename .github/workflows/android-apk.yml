name: Build MiniCraft Android APK
# Rebuild after renderer syntax correction
on:
  push:
    branches: [ "android-port" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MiniCraft.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniCraft-Android-debug
          path: app/build/outputs/apk/debug/MiniCraft.apk
          if-no-files-found: error
      - name: Publish APK to the game website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch main https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git site
          cp app/build/outputs/apk/debug/MiniCraft.apk site/MiniCraft.apk
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MiniCraft.apk
          if git diff --cached --quiet; then
            echo "Website APK is already up to date"
          else
            git commit -m "Publish Android APK from ${GITHUB_SHA::7}"
            git push origin HEAD:main
          fi
